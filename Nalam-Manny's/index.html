<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manny's Bake Shoppe</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
</head>

<body>


    <header id="top">
        <h1>Manny's Bake Shoppe</h1>
        <p>Freshly baked goods every day!</p>
        <img src="images/bread.jpg"  alt="yummy yummy bread" width="500" height="300">
    </header>       

    <nav>
        <a href="#menu">Menu</a>
        <a href="#gallery">Gallery</a>

        <a href="#about-us">About Us</a>

        <a href="https://developer.mozilla.org/" target="_blank">CSS Help</a>
    </nav>


    <main>
        <!-- Hero Section -->
        <div class="hero-image">
            <div class="hero-text">
                <h1>MANNY'S BAKE SHOPPE</h1>
                <p>Come in and eat our bread!</p>
                <button>Order Now</button>
            </div>
            </div>
        <!-- Menu, where we display our items -->
        <section id = "Menu">
            <h2>Menu</h2>

        </section>
        <!-- Gallery, where we show off our aesthethic food stuffs -->
        <section id = "Gallery">
            <h2>Gallery</h2>
        </section>

        <!-- Order Form, where customers can place their orders -->
        <section id = "Order Form">
            <h2>Order Form</h2>
        </section>
        

        <!-- About Us, where they can know more about the history of the store -->
        <section id = "About Us">
            <h2>About Us</h2>
        </section>

        <section id = "Contact Us">
            <h2>Contact Us</h2>
